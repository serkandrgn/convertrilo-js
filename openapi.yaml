  /webhooks:
    get:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: List webhooks
      description: List managed webhook subscriptions for the authenticated user. API keys need the `webhooks:manage` scope. Managed webhook deliveries include HMAC-SHA256 signatures.
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookListResponse"
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Create a webhook
      description: |
        Create a managed webhook subscription. The response includes `secret` exactly once.
        Store it securely and use it to verify `X-Webhook-Signature`.
        API keys need the `webhooks:manage` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreateRequest"
            examples:
              jobCompletionWebhook:
                summary: Completion and failure notifications
                value:
                  url: https://your-app.com/webhooks/convertrilo
                  events: [job.completed, job.failed, job.canceled]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
  /webhooks/{id}:
    patch:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Update a webhook
      description: API keys need the `webhooks:manage` scope.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdateRequest"
            examples:
              reEnableWebhook:
                summary: Re-enable a disabled webhook
                value:
                  isActive: true
              changeEvents:
                summary: Receive only terminal job events
                value:
                  events: [job.completed, job.failed, job.canceled]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
    delete:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Delete a webhook
      description: API keys need the `webhooks:manage` scope.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Test a webhook
      description: Sends a `webhook.test` event to the configured URL using the same HMAC signature header as managed deliveries. API keys need the `webhooks:manage` scope.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Test event sent }
  /webhooks/{id}/deliveries:
    get:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
