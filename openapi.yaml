openapi: 3.0.3
info:
  title: Convertrilo Encode API
  version: "1.0.0"
  description: |
    JWT-protected API for creating and managing encode jobs. Supports browser-upload, direct URL ingest, or S3 source.
    Public endpoints are limited and rate-limited.

    Swagger auth:
    1. Create an API key in Dashboard -> Developer.
    2. Click Authorize in these docs.
    3. Paste the raw API key into ApiKeyAuth.
    4. Protected endpoints can then be executed from Swagger.

    API integrations should keep Convertrilo API keys and customer storage/OAuth tokens on the server.
    For storage integrations, pass customer-owned S3 credentials or Google OAuth access/refresh tokens directly in the API request.
    Convertrilo does not require your API users to visit the dashboard OAuth flow.
    
    Official TypeScript SDK: https://www.npmjs.com/package/@convertrilo/sdk
    SDK source and examples: https://github.com/serkandrgn/convertrilo-js
    Interactive docs: https://api.convertrilo.com/docs
externalDocs:
  description: Convertrilo TypeScript SDK
  url: https://github.com/serkandrgn/convertrilo-js
servers:
  - url: /
    description: Same origin as these docs
  - url: https://api.convertrilo.com
    description: Production
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 255
      description: Optional key for safely retrying job creation requests. Reusing the same key with the same request body replays the original response; reusing it with a different body returns 409.
  schemas:
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthLoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    TokenBalanceResponse:
      type: object
      properties:
        available: { type: number }
        reserved: { type: number }
        trialGrantRemaining: { type: number }
        trialExpiresAt: { type: string, format: date-time, nullable: true }
    TokenReserveRequest:
      type: object
      required: [jobId, amount]
      properties:
        jobId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1 }
    TokenDeductRequest:
      type: object
      required: [jobId, amount]
      properties:
        jobId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1 }
    JobCreateRequest:
      type: object
      required: [codec, resolution, fps]
      properties:
        externalId:
          type: string
          maxLength: 255
          description: Your stable job identifier for reconciliation in status responses and webhooks.
        metadata:
          type: object
          additionalProperties: true
          description: Integration-owned JSON object returned in status responses and webhooks.
        codec:
          type: string
          enum: [h264, h265, av1]
        resolution:
          type: string
          enum: [480p, 720p, 1080p, 1440p, 2160p, 4320p]
        fps:
          type: integer
          minimum: 1
          maximum: 240
        container:
          type: string
          enum: [mp4, mkv, webm, mov]
          default: mp4
        preset:
          type: string
          enum: [fast, standard, slow]
          default: fast
        bitrateTier:
          type: string
          enum: [low, medium, high]
          default: medium
        passes:
          type: integer
          enum: [1, 2]
          default: 1
        policy:
          type: string
          enum: [fastest, gpu_first, gpu_only]
          default: gpu_first
        quality:
          type: string
          enum: [good, better, best]
        sourceUrl:
          type: string
          format: uri
          description: Optional direct HTTP(S) ingest. When provided, upload URL is not returned.
        sourceS3:
          type: object
          properties:
            bucket: { type: string }
            key: { type: string }
            endpoint: { type: string }
            region: { type: string }
            accessKeyId: { type: string }
            secretAccessKey: { type: string }
            forcePathStyle: { type: boolean }
        confirm: { type: boolean, default: false }
        optimize: { type: string, enum: [none, vmaf] }
        vmafTarget: { type: number, minimum: 50, maximum: 99 }
    JobCreateResponse:
      type: object
      required: [jobId, upload, output]
      properties:
        jobId: { type: string }
        externalId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status:
          type: string
          description: Present when the job is auto-confirmed and queued.
        upload:
          nullable: true
          type: object
          properties:
            url: { type: string }
            key: { type: string }
        output:
          type: object
          properties:
            key: { type: string }
            publicUrl: { type: string }
        estimate:
          type: object
          properties:
            neu: { type: number }
            totalNeu: { type: number }
            reserved: { type: number }
    ProbeDurationResponse:
      type: object
      properties:
        durationSec: { type: number }
        durationMinutes: { type: number }
    ApproveUnifiedRequest:
      type: object
      properties:
        codec: { type: string, enum: [h264, h265, av1] }
        resolution: { type: string }
        fps: { type: integer }
        preset: { type: string, enum: [fast, standard, slow] }
        bitrateTier: { type: string, enum: [low, medium, high] }
        passes: { type: integer, enum: [1, 2] }
        policy: { type: string, enum: [gpu_only, gpu_first, fastest] }
        container: { type: string, enum: [mp4, mkv, webm, mov] }
        quality: { type: string, enum: [good, better, best] }
        optimize: { type: string, enum: [none, vmaf] }
        vmafTarget: { type: number, minimum: 50, maximum: 99 }
    ApproveUnifiedResponse:
      type: object
      properties:
        ok: { type: boolean }
        estimate:
          type: object
          properties:
            perMinuteNeu: { type: number }
            durationSec: { type: number }
            totalNeu: { type: number }
            reserved: { type: number }
    ConfirmRequest:
      type: object
      properties:
        container: { type: string, enum: [mp4, mkv, webm, mov] }
        quality: { type: string, enum: [good, better, best] }
        optimize: { type: string, enum: [none, vmaf] }
        vmafTarget: { type: number, minimum: 1, maximum: 100 }
    ConfirmResponse:
      type: object
      properties:
        ok: { type: boolean }
    StatusResponse:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status: { type: string }
        ingest: { type: string, nullable: true }
        output:
          nullable: true
          type: object
          properties:
            key: { type: string }
            publicUrl: { type: string }
        downloadUrl: { type: string, nullable: true }
        encoder: { type: string, nullable: true }
        pct: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        failureMessage: { type: string, nullable: true }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code. Branch on this instead of parsing `message`.
          enum:
            - invalid_api_key
            - api_key_expired
            - user_not_found
            - account_banned
            - missing_required_scope
            - invalid_request
            - invalid_body
            - invalid_url
            - url_ingest_disabled
            - url_host_blocked
            - signed_url_required
            - host_not_resolvable
            - private_ip_blocked
            - missing_content_length
            - file_too_large
            - unsupported_content_type
            - probe_failed
            - insufficient_tokens
            - idempotency_conflict
            - idempotency_in_progress
            - rate_limit_exceeded
            - not_found
            - forbidden
            - deprecated_dropbox
            - google_drive_not_connected
            - dropbox_not_connected
            - no_video_files_found
            - webhook_limit_exceeded
            - webhook_not_found
            - no_updates_provided
            - output_not_available
        message: { type: string }
        issues:
          description: Validation details for `invalid_body`.
        requiredScope: { type: string }
        required: { type: number }
        available: { type: number }

    # Bulk Jobs
    BulkCreateRequest:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobCreateRequest"
        settings:
          type: object
          required: []
          properties:
            failFast: { type: boolean, default: false }
            dryRun: { type: boolean, default: false }
            confirm: { type: boolean, default: false }
            container: { type: string, enum: [mp4, mkv, webm, mov] }
            quality: { type: string, enum: [good, better, best] }
            optimize: { type: string, enum: [none, vmaf] }
            vmafTarget: { type: number, minimum: 50, maximum: 99 }
    BulkCreateResponse:
      type: object
      properties:
        totalJobs: { type: integer }
        totalEstimatedNeu: { type: number }
        reserved: { type: number }
        jobs:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              jobId: { type: string, format: uuid }
              externalId: { type: string, nullable: true }
              metadata:
                type: object
                additionalProperties: true
                nullable: true
              status: { type: string }
              error: { type: string }
              estimate:
                type: object
                properties:
                  neu: { type: number }
    BulkStatusResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/StatusResponse"
        missing:
          type: array
          items: { type: string }
    BulkConfirmRequest:
      type: object
      required: [jobIds]
      properties:
        jobIds:
          type: array
          items: { type: string, format: uuid }
        settings:
          type: object
          properties:
            container: { type: string, enum: [mp4, mkv, webm, mov] }
            quality: { type: string, enum: [good, better, best] }

    # API Keys
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        scopes:
          type: array
          description: |
            Requested API key scopes. Use the minimum scopes needed:
            `jobs:create`, `jobs:read`, `jobs:cancel`, `tokens:read`,
            `webhooks:manage`, and `credentials:manage` for saved S3 credential management.
          items:
            type: string
            enum:
              - jobs:create
              - jobs:read
              - jobs:cancel
              - tokens:read
              - tokens:write
              - webhooks:manage
              - credentials:manage
        expiresInDays: { type: integer, minimum: 1, maximum: 365 }
    ApiKeyResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: string, description: "Raw key, only returned on creation" }
        prefix: { type: string }
        scopes:
          type: array
          items:
            type: string
            enum:
              - jobs:create
              - jobs:read
              - jobs:cancel
              - tokens:read
              - tokens:write
              - webhooks:manage
              - credentials:manage
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApiKeyListResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyResponse"

    # Webhooks
    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              [
                job.created,
                job.queued,
                job.running,
                job.completed,
                job.failed,
                job.canceled,
              ]
    WebhookUpdateRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              [
                job.created,
                job.queued,
                job.running,
                job.completed,
                job.failed,
                job.canceled,
              ]
        isActive: { type: boolean }
    WebhookResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        secret:
          {
            type: string,
            description: "HMAC secret, only returned on creation",
          }
        isActive: { type: boolean }
        failureCount: { type: integer }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
        lastFailedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    WebhookListResponse:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/WebhookResponse"
    WebhookDeliveryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        webhookId: { type: string, format: uuid }
        event: { type: string }
        jobId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [success, failed] }
        statusCode: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        responseBody:
          type: string
          nullable: true
          description: Response body captured from the receiver, truncated to 2048 characters.
        error:
          type: string
          nullable: true
          description: Network, timeout, or delivery error, truncated to 2048 characters.
        attempt: { type: integer }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        retriedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    WebhookDeliveryListResponse:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryResponse"

    # On-Demand Encoding
    S3Output:
      type: object
      required: [bucket, key]
      properties:
        bucket: { type: string }
        key: { type: string }
        endpoint: { type: string, format: uri }
        region: { type: string }
        accessKeyId: { type: string }
        secretAccessKey: { type: string, format: password }
        forcePathStyle: { type: boolean }
    S3FolderSource:
      type: object
      description: Customer-owned S3-compatible folder source. Credentials should allow listing the prefix and reading objects.
      required: [bucket]
      properties:
        bucket: { type: string }
        prefix:
          type: string
          default: ""
          description: Prefix to crawl. Only files with video extensions are queued.
        endpoint:
          type: string
          format: uri
          description: Optional S3-compatible endpoint, for example Cloudflare R2, MinIO, or object storage providers.
        region: { type: string }
        accessKeyId:
          type: string
          description: Optional source access key. Omit only when your backend/runtime provides credentials another way.
        secretAccessKey: { type: string, format: password }
        forcePathStyle: { type: boolean, default: true }
    S3FolderOutput:
      type: object
      description: Customer-owned S3-compatible output destination. Credentials should allow writing encoded objects.
      required: [bucket]
      properties:
        bucket: { type: string }
        prefix:
          type: string
          default: outputs/
          description: Output key prefix. The source file name is appended to this prefix.
        endpoint:
          type: string
          format: uri
          description: Optional S3-compatible endpoint, for example Cloudflare R2, MinIO, or object storage providers.
        region: { type: string }
        accessKeyId:
          type: string
          description: Optional output access key. Omit only when your backend/runtime provides credentials another way.
        secretAccessKey: { type: string, format: password }
        forcePathStyle: { type: boolean, default: true }
    GoogleDriveFolderSource:
      type: object
      description: Google Drive folder source for API integrations. Pass a customer-owned OAuth token instead of sending the user through the Convertrilo dashboard.
      required: [folderId]
      properties:
        folderId: { type: string }
        accessToken:
          type: string
          description: Short-lived Google OAuth access token supplied by the API caller. Must allow reading/listing files in the folder.
        refreshToken:
          type: string
          description: Optional Google refresh token supplied by the API caller. Recommended for long-running folder jobs so workers can refresh expired access tokens.
    GoogleDriveOutput:
      type: object
      description: Google Drive output destination for API integrations. Pass a customer-owned OAuth token with upload access to the destination folder.
      required: [folderId]
      properties:
        folderId: { type: string }
        fileName: { type: string }
        accessToken:
          type: string
          description: Short-lived Google OAuth access token supplied by the API caller. Must allow uploading to the destination folder.
        refreshToken:
          type: string
          description: Optional Google refresh token supplied by the API caller. Recommended for long-running jobs so workers can refresh expired access tokens.
    OnDemandEncodeRequest:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl: { type: string, format: uri }
        externalId:
          type: string
          maxLength: 255
          description: Your stable job identifier for reconciliation in status responses and webhooks.
        metadata:
          type: object
          additionalProperties: true
          description: Integration-owned JSON object returned in status responses and webhooks.
        codec: { type: string, enum: [h264, h265, av1], default: h264 }
        resolution:
          {
            type: string,
            enum: [480p, 720p, 1080p, 1440p, 2160p],
            default: 1080p,
          }
        fps: { type: integer, minimum: 1, maximum: 120, default: 30 }
        preset: { type: string, enum: [fast, standard, slow], default: fast }
        bitrateTier:
          { type: string, enum: [low, medium, high], default: medium }
        container: { type: string, enum: [mp4, mkv, webm, mov], default: mp4 }
        quality: { type: string, enum: [good, better, best], default: better }
        priority: { type: string, enum: [normal, high], default: normal }
        outputExpiry:
          { type: integer, minimum: 3600, maximum: 604800, default: 86400 }
        webhook:
          type: string
          format: uri
          description: Optional one-off terminal callback URL for this job. Best-effort and unsigned. Use managed webhooks for signed HMAC delivery.
        outputS3:
          $ref: "#/components/schemas/S3Output"
        outputGoogleDrive:
          $ref: "#/components/schemas/GoogleDriveOutput"
        outputDropbox:
          deprecated: true
          description: Deprecated. Requests using Dropbox output return 410 Gone.
          type: object
          properties:
            path: { type: string }
            accessToken: { type: string }
    OnDemandEncodeResponse:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status: { type: string }
        estimatedDuration: { type: integer }
        pricing:
          type: object
          properties:
            basePerMinute: { type: number }
            onDemandPerMinute: { type: number }
            multiplier: { type: number }
            totalNeu: { type: number }
            reserved: { type: number }
        statusUrl: { type: string }
        webhook: { type: string, nullable: true }
    OnDemandStatusResponse:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status: { type: string }
        progress: { type: number, nullable: true }
        encoder: { type: string, nullable: true }
        downloadUrl: { type: string, nullable: true }
        expiresIn: { type: integer, nullable: true }
        destination:
          oneOf:
            - type: object
              properties:
                type: { type: string, enum: [cdn] }
            - type: object
              properties:
                type: { type: string, enum: [s3] }
                bucket: { type: string }
                key: { type: string }
            - type: object
              properties:
                type: { type: string, enum: [google-drive] }
                folderId: { type: string }
                fileName: { type: string, nullable: true }
          nullable: true
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        failureMessage: { type: string, nullable: true }
    OnDemandFolderIngestRequest:
      type: object
      properties:
        externalIdPrefix:
          type: string
          maxLength: 200
          description: Optional prefix used to generate one externalId per queued file as `${externalIdPrefix}:${fileName}`.
        metadata:
          type: object
          additionalProperties: true
          description: Integration-owned JSON object attached to every queued job and returned in webhooks/status responses.
        codec: { type: string, enum: [h264, h265, av1], default: h264 }
        resolution:
          {
            type: string,
            enum: [480p, 720p, 1080p, 1440p, 2160p, 4320p],
            default: 1080p,
          }
        fps: { type: integer, minimum: 1, maximum: 120, default: 30 }
        preset: { type: string, enum: [fast, standard, slow], default: fast }
        bitrateTier:
          { type: string, enum: [low, medium, high], default: medium }
        passes: { type: integer, minimum: 1, maximum: 2, default: 1 }
        optimize: { type: string, enum: [none, vmaf], default: none }
        vmafTarget: { type: integer, minimum: 50, maximum: 99 }
        container: { type: string, enum: [mp4, mkv, webm, mov], default: mp4 }
        quality: { type: string, enum: [good, better, best], default: better }
        priority: { type: string, enum: [normal, high], default: normal }
        maxFiles:
          type: integer
          minimum: 1
          maximum: 1000
          description: Optional cap on the number of discovered video files to queue from the folder.
        sourceS3:
          $ref: "#/components/schemas/S3FolderSource"
        sourceGoogleDrive:
          $ref: "#/components/schemas/GoogleDriveFolderSource"
        sourceDropbox:
          deprecated: true
          description: Deprecated. Requests using Dropbox ingest return 410 Gone.
          type: object
          properties:
            path: { type: string }
            accessToken: { type: string }
        outputDestination:
          type: string
          enum: [cdn, s3, google-drive]
          default: cdn
        outputS3:
          $ref: "#/components/schemas/S3FolderOutput"
        outputGoogleDrive:
          $ref: "#/components/schemas/GoogleDriveOutput"
        outputDropbox:
          deprecated: true
          description: Deprecated. Requests using Dropbox output return 410 Gone.
          type: object
          properties:
            path: { type: string }
    OnDemandFolderIngestResponse:
      type: object
      properties:
        message: { type: string }
        jobs:
          type: array
          items:
            type: object
            properties:
              jobId: { type: string, format: uuid }
              externalId: { type: string, nullable: true }
              fileName: { type: string }

    # Streaming
    StreamInitResponse:
      type: object
      properties:
        ok: { type: boolean }
        uploadId: { type: string }
        inputKey: { type: string }
    StreamFinalizeRequest:
      type: object
      properties:
        parts:
          type: array
          items:
            type: object
            properties:
              PartNumber: { type: integer }
              ETag: { type: string }
security:
  - BearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login and receive JWTs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
  /tokens/balance:
    get:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Get token balance
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBalanceResponse"
  /tokens/reserve:
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Reserve tokens for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenReserveRequest"
      responses:
        "200": { description: Reserved or insufficient }
  /tokens/release:
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Release reserved tokens for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenReserveRequest"
      responses:
        "200": { description: Released }
  /tokens/deduct:
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Deduct tokens after a job
      requestBody:
