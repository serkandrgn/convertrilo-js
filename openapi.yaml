  # On-Demand Encoding API
  /ondemand/encode:
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Submit video for immediate on-demand encoding
      description: |
        Simplified API for immediate video encoding. Automatically probes, reserves tokens, 
        and starts encoding. Premium pricing (1.5x-2x) for on-demand convenience.
        Send `Idempotency-Key` when retrying from your backend to avoid duplicate jobs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnDemandEncodeRequest"
            examples:
              urlToCdn:
                summary: URL source to CDN output
                value:
                  sourceUrl: https://example.com/video.mp4
                  externalId: customer-video-123
                  metadata:
                    customerId: cus_123
                    workflow: daily-compression
                  codec: h264
                  resolution: 1080p
                  quality: better
              urlToS3:
                summary: URL source to S3 output
                value:
                  sourceUrl: https://example.com/video.mp4
                  codec: h264
                  resolution: 1080p
                  outputS3:
                    bucket: customer-output-bucket
                    key: encoded/video-1080p.mp4
                    region: us-east-1
                    accessKeyId: AKIA...
                    secretAccessKey: replace-with-secret
              urlToGoogleDrive:
                summary: URL source to Google Drive output with BYO token
                value:
                  sourceUrl: https://example.com/video.mp4
                  codec: h264
                  resolution: 1080p
                  outputGoogleDrive:
                    folderId: GOOGLE_DRIVE_FOLDER_ID
                    fileName: video-1080p.mp4
                    accessToken: ya29...
                    refreshToken: optional-refresh-token
      responses:
        "200":
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnDemandEncodeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Deprecated Dropbox destination requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ondemand/ingest/folder:
    post:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Ingest videos from an S3 or Google Drive folder
      description: |
        Crawls an S3 prefix or Google Drive folder, queues one encode job per video file,
        and optionally delivers outputs to CDN, S3, or Google Drive.

        For API integrations, use bring-your-own credentials:
        - S3-compatible storage: pass `sourceS3` and/or `outputS3` credentials from your backend.
        - Google Drive: pass customer OAuth `accessToken` values in `sourceGoogleDrive` and/or `outputGoogleDrive`.
        - Include `refreshToken` when jobs may outlive a short access token.

        Your users do not need to connect Google Drive inside the Convertrilo dashboard for API usage.
        Send `Idempotency-Key` when retrying from your backend to avoid duplicate folder batches.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnDemandFolderIngestRequest"
            examples:
              s3FolderToS3:
                summary: S3 folder source to S3 output
                value:
                  externalIdPrefix: batch-2026-06-09
                  metadata:
                    customerId: cus_123
                    workflow: folder-compression
                  sourceS3:
                    bucket: customer-source-bucket
                    prefix: incoming/
                    region: us-east-1
                    accessKeyId: AKIA...
                    secretAccessKey: replace-with-secret
                  outputDestination: s3
                  outputS3:
                    bucket: customer-output-bucket
                    prefix: encoded/
                    region: us-east-1
                    accessKeyId: AKIA...
                    secretAccessKey: replace-with-secret
                  codec: h264
                  resolution: 1080p
              googleDriveFolderToGoogleDrive:
                summary: Google Drive folder source to Google Drive output
                value:
                  sourceGoogleDrive:
                    folderId: SOURCE_FOLDER_ID
                    accessToken: ya29...
                    refreshToken: optional-refresh-token
                  outputDestination: google-drive
                  outputGoogleDrive:
                    folderId: OUTPUT_FOLDER_ID
                    accessToken: ya29...
                    refreshToken: optional-refresh-token
                  codec: h264
                  resolution: 1080p
      responses:
        "200":
          description: Folder jobs queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnDemandFolderIngestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or expired Google Drive token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No video files found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Deprecated Dropbox source or destination requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ondemand/status/{jobId}:
    get:
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      summary: Get on-demand job status and download URL
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job status
          content:
